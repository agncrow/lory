<!DOCTYPE html>
<!-- Babylon.js (7.54.3) in colour: its StandardMaterial on a red sphere, a
     blue box turned a quarter of a right angle and a green ground, under a
     hemispheric light (0.4, its ground a dark grey, no highlight) and a
     directional light (0.8): the picture ../sun.co is held to. -->
<html><head><title>waiting</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1280px;height:720px}</style>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js"></script>
</head><body><canvas id="c"></canvas><script>
const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true });
const scene = new BABYLON.Scene(engine);
const camera = new BABYLON.FreeCamera('camera', new BABYLON.Vector3(3, 4, -8), scene);
camera.setTarget(new BABYLON.Vector3(0, 0.5, 0));
const sky = new BABYLON.HemisphericLight('sky', new BABYLON.Vector3(0, 1, 0), scene);
sky.intensity = 0.4;
sky.groundColor = new BABYLON.Color3(0.25, 0.25, 0.25);
sky.specular = new BABYLON.Color3(0, 0, 0);
const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-1, -2, -1), scene);
sun.intensity = 0.8;
const paint = (r, g, b) => { const m = new BABYLON.StandardMaterial('m', scene); m.diffuseColor = new BABYLON.Color3(r, g, b); return m; };
const ball = BABYLON.MeshBuilder.CreateSphere('ball', { diameter: 2, segments: 32 }, scene);
ball.position = new BABYLON.Vector3(-1.2, 1, 0);
ball.material = paint(1, 0.3, 0.3);
const box = BABYLON.MeshBuilder.CreateBox('box', { size: 1.4 }, scene);
box.position = new BABYLON.Vector3(1.5, 0.7, 0.5);
box.rotation.y = Math.PI / 4;
box.material = paint(0.3, 0.5, 1);
const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 8, height: 8 }, scene);
ground.material = paint(0.4, 0.7, 0.4);
scene.executeWhenReady(() => { scene.render(); scene.render(); document.title = 'drawn'; });
</script></body></html>
