# Lory takes no pull requests during the alpha (CONTRIBUTING.md): each
# pull request is closed at once with the note, so nobody waits on it.
# Nothing of the pull request is checked out or run.
name: Pull requests
on:
  pull_request_target:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          NOTE: >-
            Thank you for the pull request. Lory takes no pull requests
            during the alpha: its controls and the Crow they are written in
            still change between releases, and every line is kept under one
            hand (CONTRIBUTING.md). A bug report with the program that shows
            it, or a question, is welcome in Issues.
        run: gh pr close "$PR" --repo "$REPO" --comment "$NOTE"
