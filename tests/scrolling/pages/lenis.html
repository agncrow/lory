<!doctype html>
<!-- Lenis on a fixed page, for tests/scrolling/reference.py: a page 5000 px
     tall, smoothed by a Lenis made afresh for each case, its frames given
     by hand (lenis.raf at fixed times), wheel events sent at fixed frames,
     and what Lenis holds read after every frame: the scroll it shows, the
     scroll it aims at, its velocity, direction and progress. -->
<html><head><meta charset="utf-8">
<style>
body { margin: 0; height: 5000px; }
#out { position: fixed; top: 0; right: 0; width: 10px; height: 10px; overflow: hidden; margin: 0; }
</style></head><body>
<pre id="out">pending</pre>
<script>
// (no frames are drawn under a virtual time budget; Lenis's own frame
// requests, for its scrollend event, are given timers)
window.requestAnimationFrame = (f) => setTimeout(() => f(performance.now()), 16);
window.cancelAnimationFrame = (id) => clearTimeout(id);
</script>
<script src="lib/lenis/dist/lenis.js"></script>
<script>
const step = 1000 / 60;
const linear = (t) => t;
// (each case: Lenis's options, where the page starts, how many frames,
// what happens at which frame, and the frames' lengths when not 60 a second)
const cases = [
  {name: 'one', frames: 90, at: {0: [['wheel', 100]]}},
  {name: 'three', frames: 120, at: {0: [['wheel', 100]], 5: [['wheel', 100]], 10: [['wheel', 100]]}},
  {name: 'lines', frames: 60, at: {0: [['wheel', 3, 1]]}},
  {name: 'pages', frames: 90, at: {0: [['wheel', 1, 2]]}},
  {name: 'slow', options: {lerp: 0.05}, frames: 150, at: {0: [['wheel', 240]]}},
  {name: 'quick', options: {lerp: 0.2, wheelMultiplier: 1.5}, frames: 60, at: {0: [['wheel', 100]]}},
  {name: 'back', frames: 120, at: {0: [['wheel', 300]], 8: [['wheel', -500]]}},
  {name: 'top', frames: 20, at: {0: [['wheel', -100]]}},
  {name: 'end', start: 4237, frames: 60, at: {0: [['wheel', 200]]}},
  {name: 'timed_wheel', options: {duration: 0.8}, frames: 80, at: {0: [['wheel', 100]], 10: [['wheel', 100]]}},
  {name: 'to_duration', frames: 90, at: {0: [['to', 2000, {duration: 1.2}]]}},
  {name: 'to_lerp', frames: 120, at: {0: [['to', 1500]]}},
  {name: 'to_linear', start: 300, frames: 40, at: {0: [['to', 1000, {offset: -100, duration: 0.5, easing: 'linear'}]]}},
  {name: 'to_immediate', frames: 4, at: {1: [['to', 800, {immediate: true}]]}},
  {name: 'to_bottom', start: 4000, frames: 60, at: {0: [['to', 'bottom', {duration: 0.6}]]}},
  {name: 'wheel_during_to', frames: 90, at: {0: [['to', 1000, {duration: 1}]], 20: [['wheel', 100]]}},
  {name: 'stopped', frames: 60, at: {0: [['stop'], ['wheel', 100]], 10: [['start'], ['wheel', 100]]}},
  {name: 'uneven', frames: 12, at: {0: [['wheel', 400]]}, lengths: [16, 33, 8, 50, 16, 100, 4, 250, 16, 16, 120, 16]},
];
// (each frame: [time, the scroll shown, the scroll aimed at, velocity,
// progress, what Lenis says it is doing])
const out = {window_height: window.innerHeight, scroll_height: document.documentElement.scrollHeight, step, cases: []};
for (const c of cases) {
  window.scrollTo(0, c.start || 0);
  const lenis = new Lenis(Object.assign({autoRaf: false}, c.options || {}));
  const seen = {name: c.name, options: c.options || {}, start: c.start || 0, at: c.at, lengths: c.lengths || null,
                limit: lenis.limit, frames: []};
  let time = 1000;
  lenis.raf(time);
  for (let k = 0; k < c.frames; k++) {
    for (const [what, a, b] of (c.at[k] || [])) {
      if (what === 'wheel') {
        window.dispatchEvent(new WheelEvent('wheel', {deltaY: a, deltaMode: b || 0, cancelable: true, bubbles: true}));
      } else if (what === 'to') {
        const o = Object.assign({}, b || {});
        if (o.easing === 'linear') o.easing = linear;
        lenis.scrollTo(a, o);
      } else if (what === 'stop') lenis.stop();
      else if (what === 'start') lenis.start();
    }
    time += c.lengths ? c.lengths[k] : step;
    lenis.raf(time);
    seen.frames.push([time, lenis.animatedScroll, lenis.targetScroll, lenis.velocity, lenis.progress, lenis.isScrolling]);
  }
  out.cases.push(seen);
  lenis.destroy();
}
document.getElementById('out').textContent = JSON.stringify(out);
</script></body></html>
