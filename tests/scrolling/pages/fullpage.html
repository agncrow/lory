<!doctype html>
<!-- fullPage.js on fixed pages, for tests/scrolling/reference.py. fullPage.js
     is GPLv3 or commercial: it is only run here, to learn what it does; none
     of it is copied into Lory. Each run (?run=NAME) builds its own sections,
     starts fullPage with its own options, does fixed things at fixed times
     (keys, wheel turns, clicks on its dots and arrows, hash changes, scrolls)
     and writes down, after each, the section and slide it holds, the hash,
     its classes, where it moved its wrapper and slides, and every callback
     it called with its arguments and time. Scroll animations it runs by
     script are sampled every 4 ms. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="lib/fullpage.js/dist/fullpage.css">
<style>
body { margin: 0; font: 16px sans-serif; }
#out { position: fixed; top: 0; right: 0; width: 10px; height: 10px; overflow: hidden; margin: 0; z-index: 99999; }
#menu { position: fixed; top: 0; left: 0; z-index: 70; margin: 0; padding: 0; list-style: none; }
#menu li { display: inline-block; margin: 4px; }
</style></head><body>
<ul id="menu"></ul>
<div id="fullpage"></div>
<pre id="out">pending</pre>
<script>
// (no frames are drawn under a virtual time budget: frames are given by
// timers, before fullPage is loaded)
window.requestAnimationFrame = (f) => setTimeout(() => f(performance.now()), 16);
window.cancelAnimationFrame = (id) => clearTimeout(id);
</script>
<script src="lib/fullpage.js/dist/fullpage.js"></script>
<script>
const PIXEL = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const query = new URLSearchParams(location.search);
const run = query.get('run') || 'defaults';
const t0 = performance.now();
const now = () => Math.round((performance.now() - t0) * 1000) / 1000;
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const wrapper = () => document.getElementById('fullpage');
let calls = [];
const slim = (x) => (x && typeof x === 'object' && 'index' in x)
  ? {index: x.index, anchor: x.anchor === undefined ? null : x.anchor, first: x.isFirst, last: x.isLast}
  : (x === undefined ? null : x);
// (each callback is written down; `answers` may give one an answer)
const answers = {};
const hooks = {};
for (const name of ['beforeLeave', 'onLeave', 'afterLoad', 'afterRender', 'afterResize', 'afterReBuild',
                    'afterResponsive', 'afterSlideLoad', 'onSlideLeave', 'onScrollOverflow']) {
  hooks[name] = function (...a) {
    calls.push({name, t: now(), args: a.map(slim)});
    if (answers[name]) return answers[name](...a);
  };
}

function build(spec, menu) {
  const w = wrapper();
  w.innerHTML = '';
  spec.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'section' + (s.cls ? ' ' + s.cls : '');
    d.dataset.i = i;
    if (s.style) d.setAttribute('style', s.style);
    if (s.tooltip) d.dataset.tooltip = s.tooltip;
    if (s.slides) {
      for (let k = 0; k < s.slides; k++) {
        const sl = document.createElement('div');
        sl.className = 'slide';
        sl.textContent = 'slide ' + k;
        if (s.slide_anchors) sl.dataset.anchor = s.slide_anchors[k];
        if (s.slide_imgs) { const im = document.createElement('img'); im.dataset.src = PIXEL; im.id = 'img' + i + '_' + k; sl.appendChild(im); }
        d.appendChild(sl);
      }
    } else {
      d.appendChild(document.createTextNode('section ' + i));
    }
    if (s.tall) { const inner = document.createElement('div'); inner.style.height = s.tall + 'px'; inner.textContent = 'tall'; d.appendChild(inner); }
    if (s.img) { const im = document.createElement('img'); im.dataset.src = PIXEL; im.id = 'img' + i; d.appendChild(im); }
    w.appendChild(d);
  });
  const m = document.getElementById('menu');
  m.innerHTML = '';
  for (const a of (menu || [])) {
    const li = document.createElement('li');
    li.dataset.menuanchor = a;
    li.innerHTML = '<a href="#' + a + '">' + a + '</a>';
    m.appendChild(li);
  }
}

function start(spec, options, menu) {
  build(spec, menu);
  return new fullpage('#fullpage', Object.assign({}, options, hooks));
}

function state(did) {
  const w = wrapper();
  const section = fullpage_api.getActiveSection();
  const slide = fullpage_api.getActiveSlide();
  const el = section && section.item;
  const slides = el ? el.querySelector('.fp-slidesContainer') : null;
  const seen = {
    did, t: now(),
    section: section ? (typeof section.index === 'function' ? section.index() : section.index) : null,
    slide: slide ? (typeof slide.index === 'function' ? slide.index() : slide.index) : null,
    hash: location.hash,
    body: document.body.className,
    transform: w.style.transform,
    transition: w.style.transition,
    top: w.style.top,
    scroll: window.scrollY,
    order: Array.from(w.children).map(c => +c.dataset.i),
    history: history.length,
    calls,
  };
  if (slides) seen.slides = {transform: slides.style.transform, transition: slides.style.transition, left: slides.style.left,
                             scroll: el.querySelector('.fp-slides').scrollLeft};
  calls = [];
  return seen;
}

const CODES = {ArrowDown: 40, ArrowUp: 38, PageDown: 34, PageUp: 33, Home: 36, End: 35, ' ': 32, ArrowLeft: 37, ArrowRight: 39};
function key(k, shift) {
  for (const type of ['keydown', 'keyup']) {
    const e = new KeyboardEvent(type, {key: k, code: k === ' ' ? 'Space' : k, shiftKey: !!shift, bubbles: true, cancelable: true});
    Object.defineProperty(e, 'keyCode', {get: () => CODES[k]});
    Object.defineProperty(e, 'which', {get: () => CODES[k]});
    (document.activeElement || document.body).dispatchEvent(e);
  }
}
// (a wheel event as the browser sends one: Chrome gives an event made by
// script the old `wheelDelta` with the sign of deltaY, where a real wheel's
// has the other sign and 1.2 times the size)
function wheel(dy, where) {
  (where || wrapper()).dispatchEvent(new WheelEvent('wheel', {deltaY: dy, wheelDeltaY: -Math.round(1.2 * dy), deltaMode: 0,
                                                              bubbles: true, cancelable: true}));
}
function click(el) {
  el.dispatchEvent(new MouseEvent('click', {bubbles: true, cancelable: true, view: window}));
}
function scrolled(y) {
  window.scrollTo(0, y);
  window.dispatchEvent(new Event('scroll'));
}
// (what fullPage scrolls by script, read every 4 ms)
function sampled(ms) {
  const out = [];
  const begin = now();
  return new Promise(r => {
    const tick = () => {
      const w = wrapper();
      out.push([Math.round((now() - begin) * 1000) / 1000, window.scrollY, w.style.top, w.style.transform]);
      if (now() - begin < ms) setTimeout(tick, 4); else r(out);
    };
    tick();
  });
}
function rect(el) {
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return [r.left, r.top, r.width, r.height];
}
function options() {
  return JSON.parse(JSON.stringify(fullpage_api.getFullpageData().options,
    (k, v) => typeof v === 'function' ? 'function' : (v instanceof Element ? 'element' : v)));
}
const five = () => [{}, {}, {}, {}, {}];
const anchors5 = ['one', 'two', 'three', 'four', 'five'];

const runs = {
  async defaults() {
    start(five(), {});
    await wait(300);
    return {options: options(), first: state('start'),
            sections: Array.from(document.querySelectorAll('.fp-section')).map(rect),
            classes: {html: document.documentElement.className, wrapper: wrapper().className,
                      section: wrapper().children[0].className}};
  },

  // the keys, one each 1200 ms, in a page of five sections (the second
  // with three slides)
  async keys() {
    start([{}, {slides: 3}, {}, {}, {}], {anchors: anchors5});
    await wait(300);
    const steps = [state('start')];
    const presses = [['ArrowDown'], ['ArrowRight'], ['ArrowRight'], ['ArrowRight'], ['ArrowLeft'], ['PageDown'],
                     [' '], [' ', true], ['PageUp'], ['End'], ['ArrowDown'], ['PageDown'], [' '], ['Home'],
                     ['ArrowUp'], ['PageUp'], ['End'], ['PageUp'], ['Home']];
    for (const [k, shift] of presses) {
      key(k, shift);
      await wait(1200);
      steps.push(state((shift ? 'shift+' : '') + (k === ' ' ? 'Space' : k)));
    }
    return {steps};
  },

  // a key held down: pressed every 5 ms for 4 s, in ten sections; and a
  // move asked by the API while one runs
  async lock() {
    start([{}, {}, {}, {}, {}, {}, {}, {}, {}, {}], {});
    await wait(300);
    const begin = now();
    while (now() - begin < 4000) { key('ArrowDown'); await wait(5); }
    await wait(1000);
    const held = state('held');
    fullpage_api.moveTo(1);
    await wait(1000);
    const back = state('moveTo 1');
    fullpage_api.moveSectionDown();
    await wait(200);
    fullpage_api.moveSectionDown();
    await wait(1000);
    const api = state('moveSectionDown twice, 200 ms apart');
    fullpage_api.moveSectionDown();
    await wait(705);
    fullpage_api.moveSectionDown();
    await wait(1000);
    const after = state('moveSectionDown twice, 705 ms apart');
    return {begin, held, back, api, after};
  },

  // wheel turns: one; a steady stream; a fling dying away; small ones; up
  async wheel() {
    start(Array.from({length: 40}, () => ({})), {});
    await wait(300);
    const cases = [];
    // (each turn: the wheel's deltas, the time between them, and a pause
    // inside it, before the delta at `pause_at`)
    const turn = async (name, deltas, every, pause_at, pause) => {
      const sent = [];
      for (let i = 0; i < deltas.length; i++) {
        if (i === pause_at) await wait(pause);
        sent.push([now(), deltas[i]]);
        wheel(deltas[i]);
        await wait(every);
      }
      await wait(2000);
      cases.push({name, sent, seen: state(name)});
    };
    const fling = (n, from, k) => Array.from({length: n}, (_, i) => Math.round(from * Math.pow(k, i) * 100) / 100);
    await turn('big_then_flat', [100, 100, 2500, ...Array(100).fill(50)], 16);
    await turn('gentle_decay', Array.from({length: 60}, (_, k) => 120 - k), 16);
    await turn('decay_rise', [...fling(50, 100, 0.95), ...Array.from({length: 20}, (_, k) => 10 * (k + 1))], 16);
    await turn('decay_flat_rise', [...fling(30, 120, 0.9), ...Array(30).fill(5), ...Array.from({length: 30}, (_, k) => 5 + 2 * (k + 1))], 16);
    await turn('fling_pause_250', [...fling(60, 120, 0.93), 5], 16, 60, 250);
    await turn('fling_pause_150', [...fling(60, 120, 0.93), 5], 16, 60, 150);
    await turn('stick', Array(150).fill(16.67), 13.9);
    await turn('one', [100], 16);
    await turn('pair', [100, 100], 16);
    await turn('pair_250', [100, 100], 250);
    await turn('pair_150', [100, 100], 150);
    await turn('stream', Array(94).fill(100), 16);
    await turn('accelerating', [10, 20, 40, 80, 120], 16);
    await turn('fling', fling(90, 120, 0.93), 16);
    await turn('up', [-100], 16);
    await turn('up_pair', [-100, -100], 16);
    await turn('small_pair', [4, 4], 16);
    await turn('tiny_pair', [1, 1], 16);
    await turn('two_flings', [...fling(20, 120, 0.85), ...Array(30).fill(1), ...fling(20, 120, 0.85)], 16);
    await turn('slow_and_quick', [100, 100, 100, 100], 400);
    await turn('spaced', [100, 100, 100], 1000);
    await turn('dip', [120, 100, 80, 60, 40, 60, 80, 100, 120, 140], 16);
    await turn('long_fling', fling(150, 150, 0.97), 16);
    return {cases};
  },

  // the dots: where they are, their tooltips, a click on each; the menu
  async nav() {
    start([{}, {slides: 3}, {tooltip: 'From data'}, {}, {}],
          {anchors: anchors5, navigation: true, navigationTooltips: ['First', 'Second'], showActiveTooltip: true,
           slidesNavigation: true, menu: '#menu'}, anchors5);
    await wait(300);
    const dots = () => Array.from(document.querySelectorAll('#fp-nav li')).map(li => ({
      rect: rect(li), link: li.querySelector('a').getAttribute('href'), active: li.querySelector('a').className,
      tip: li.querySelector('.fp-tooltip') ? li.querySelector('.fp-tooltip').textContent : null,
      tip_class: li.querySelector('.fp-tooltip') ? li.querySelector('.fp-tooltip').className : null,
      dot: rect(li.querySelector('a span:last-child'))}));
    const menu = () => Array.from(document.querySelectorAll('#menu li')).map(li => li.className);
    const out = {nav: {rect: rect(document.getElementById('fp-nav')), class: document.getElementById('fp-nav').className},
                 dots: dots(), menu: menu(), steps: [state('start')]};
    const clickDot = async (k) => {
      click(document.querySelectorAll('#fp-nav li a')[k]);
      await wait(1200);
      const s = state('dot ' + k);
      s.dots = dots().map(d => d.active);
      s.menu = menu();
      out.steps.push(s);
    };
    await clickDot(2);
    await clickDot(0);
    await clickDot(4);
    await clickDot(1);
    // the slides' dots, in the second section
    const slideDots = () => Array.from(document.querySelectorAll('.section.active .fp-slidesNav li')).map(li => ({
      rect: rect(li), active: li.querySelector('a').className}));
    out.slide_dots = slideDots();
    out.slide_nav = {rect: rect(document.querySelector('.section.active .fp-slidesNav')),
                     class: document.querySelector('.section.active .fp-slidesNav').className};
    click(document.querySelectorAll('.section.active .fp-slidesNav li a')[2]);
    await wait(1200);
    let s = state('slide dot 2');
    s.slide_dots = slideDots().map(d => d.active);
    out.steps.push(s);
    // a menu link
    click(document.querySelector('#menu li[data-menuanchor="four"] a'));
    await wait(1200);
    s = state('menu four');
    s.menu = menu();
    out.steps.push(s);
    // the dots on the left
    fullpage_api.destroy('all');
    start(five(), {navigation: true, navigationPosition: 'left'});
    await wait(300);
    out.left = {rect: rect(document.getElementById('fp-nav')), class: document.getElementById('fp-nav').className, dots: dots()};
    return out;
  },

  // opened with #three in the address; then hashes, the API, history
  async anchors() {
    start([{}, {slides: 3, slide_anchors: ['s0', 's1', 's2']}, {}, {}, {}], {anchors: anchors5});
    const steps = [state('opened')];
    await wait(1200);
    steps.push(state('opened, after 1200 ms'));
    const go = async (what, f) => { f(); await wait(1200); steps.push(state(what)); };
    await go('hash #five', () => { location.hash = '#five'; });
    await go('hash #two/s2', () => { location.hash = '#two/s2'; });
    await go('hash #two/1', () => { location.hash = '#two/1'; });
    await go('hash #nowhere', () => { location.hash = '#nowhere'; });
    await go('moveTo four', () => fullpage_api.moveTo('four'));
    await go('moveTo 2, 2', () => fullpage_api.moveTo(2, 2));
    await go('silentMoveTo 1', () => fullpage_api.silentMoveTo(1));
    await go('history back', () => history.back());
    await go('setLockAnchors true, hash #five', () => { fullpage_api.setLockAnchors(true); location.hash = '#five'; });
    await go('setRecordHistory false, moveTo 3', () => { fullpage_api.setLockAnchors(false); fullpage_api.setRecordHistory(false); fullpage_api.moveTo(3); });
    await go('moveTo 4', () => fullpage_api.moveTo(4));
    return {steps};
  },

  async anchors_still() {
    start(five(), {anchors: anchors5, animateAnchor: false});
    const steps = [state('opened')];
    await wait(1200);
    steps.push(state('opened, after 1200 ms'));
    return {steps};
  },

  async loops() {
    start(five(), {loopTop: true, loopBottom: true});
    await wait(300);
    const steps = [state('start')];
    for (const k of ['ArrowUp', 'ArrowDown', 'End', 'ArrowDown', 'PageUp', 'Home', 'PageUp']) {
      key(k);
      steps.push(state(k + ', at once'));
      await wait(1200);
      steps.push(state(k));
    }
    return {steps};
  },

  async continuous() {
    start(five(), {continuousVertical: true});
    await wait(300);
    const steps = [state('start')];
    for (const k of ['ArrowUp', 'ArrowDown', 'End', 'ArrowDown', 'ArrowDown', 'ArrowUp', 'ArrowUp']) {
      key(k);
      steps.push(state(k + ', at once'));
      await wait(350);
      steps.push(state(k + ', 350 ms'));
      await wait(850);
      steps.push(state(k));
    }
    return {options: options(), steps};
  },

  async slides() {
    start([{}, {slides: 4}, {}], {slidesNavigation: true});
    await wait(300);
    fullpage_api.moveTo(2);
    await wait(1200);
    const arrows = () => Array.from(document.querySelectorAll('.section.active .fp-arrow')).map(a => ({
      class: a.className, rect: rect(a), display: getComputedStyle(a).display,
      color: getComputedStyle(a).borderRightColor + ' ' + getComputedStyle(a).borderLeftColor,
      borders: getComputedStyle(a).borderWidth}));
    const out = {arrows: arrows(), steps: [state('at the slides')]};
    const prev = () => document.querySelector('.section.active .fp-prev');
    const next = () => document.querySelector('.section.active .fp-next');
    const go = async (what, f) => { f(); const at = state(what + ', at once'); await wait(1200); const s = state(what); s.at_once = at; s.arrows = arrows().map(a => a.display); out.steps.push(s); };
    await go('next', () => click(next()));
    await go('next', () => click(next()));
    await go('next', () => click(next()));
    await go('next at the last', () => click(next()));
    await go('prev at the first', () => click(prev()));
    await go('ArrowLeft', () => key('ArrowLeft'));
    await go('ArrowRight', () => key('ArrowRight'));
    await go('slide dot 1', () => click(document.querySelectorAll('.section.active .fp-slidesNav li a')[1]));
    await go('moveSlideRight', () => fullpage_api.moveSlideRight());
    await go('moveSlideLeft', () => fullpage_api.moveSlideLeft());
    await go('ArrowDown, leaving', () => key('ArrowDown'));
    await go('ArrowUp, back', () => key('ArrowUp'));
    return out;
  },

  async slides_still() {
    start([{}, {slides: 4}, {}], {loopHorizontal: false, controlArrowColor: '#0a0'});
    await wait(300);
    fullpage_api.moveTo(2);
    await wait(1200);
    const arrows = () => Array.from(document.querySelectorAll('.section.active .fp-arrow')).map(a => getComputedStyle(a).display);
    const out = {colors: Array.from(document.querySelectorAll('.section.active .fp-arrow')).map(a => [getComputedStyle(a).borderRightColor, getComputedStyle(a).borderLeftColor]),
                 steps: []};
    const go = async (what, f) => { f(); await wait(1200); const s = state(what); s.arrows = arrows(); out.steps.push(s); };
    await go('start', () => {});
    await go('prev at the first', () => click(document.querySelector('.section.active .fp-prev')));
    await go('ArrowLeft at the first', () => key('ArrowLeft'));
    for (let k = 0; k < 3; k++) await go('next', () => click(document.querySelector('.section.active .fp-next')));
    await go('next at the last', () => click(document.querySelector('.section.active .fp-next')));
    await go('ArrowRight at the last', () => key('ArrowRight'));
    return out;
  },

  // normal scrolling, fitted to the section after a pause
  async fit() {
    start(five(), {autoScrolling: false});
    await wait(300);
    const out = {options: {autoScrolling: options().autoScrolling, fitToSection: options().fitToSection, delay: options().fitToSectionDelay},
                 steps: [state('start')]};
    for (const y of [100, 356, 357, 600, 1000, 1400, 1426, 2200, 2852, 2000]) {
      scrolled(y);
      const at = state('scrolled to ' + y + ', at once');
      const curve = sampled(1800);
      await wait(1900);
      const s = state('scrolled to ' + y);
      s.at_once = at;
      s.curve = (await curve).filter((p, i, all) => i === 0 || p[1] !== all[i - 1][1] || i === all.length - 1);
      out.steps.push(s);
    }
    // a scroll in pieces, each before the pause has passed
    for (const y of [800, 900, 1000]) { scrolled(y); await wait(300); }
    const pieces = sampled(1800);
    await wait(1900);
    const s = state('scrolled 800, 900, 1000, 300 ms apart');
    s.curve = (await pieces).filter((p, i, all) => i === 0 || p[1] !== all[i - 1][1] || i === all.length - 1);
    out.steps.push(s);
    // keys and the API still move by sections
    key('ArrowDown');
    const keyed = sampled(1000);
    await wait(1100);
    const k = state('ArrowDown');
    k.curve = (await keyed).filter((p, i, all) => i === 0 || p[1] !== all[i - 1][1] || i === all.length - 1);
    out.steps.push(k);
    return out;
  },

  async fit_off() {
    start(five(), {autoScrolling: false, fitToSection: false});
    await wait(300);
    const steps = [state('start')];
    for (const y of [300, 357, 1100, 2852]) { scrolled(y); await wait(1900); steps.push(state('scrolled to ' + y)); }
    return {steps};
  },

  async scrollbar() {
    start(five(), {scrollBar: true});
    await wait(300);
    const out = {options: {autoScrolling: options().autoScrolling, scrollBar: options().scrollBar}, steps: [state('start')]};
    fullpage_api.moveSectionDown();
    const moved = sampled(1000);
    await wait(1100);
    const s = state('moveSectionDown');
    s.curve = (await moved).filter((p, i, all) => i === 0 || p[1] !== all[i - 1][1] || i === all.length - 1);
    out.steps.push(s);
    scrolled(1100);
    const fitted = sampled(1800);
    await wait(1900);
    const f = state('scrolled to 1100');
    f.curve = (await fitted).filter((p, i, all) => i === 0 || p[1] !== all[i - 1][1] || i === all.length - 1);
    out.steps.push(f);
    return out;
  },

  // moved by script, not by the stylesheet
  async script() {
    start(five(), {css3: false});
    await wait(300);
    const out = {steps: [state('start')]};
    for (const what of ['moveSectionDown', 'moveTo 4', 'moveSectionUp']) {
      if (what === 'moveTo 4') fullpage_api.moveTo(4); else fullpage_api[what]();
      const moved = sampled(1000);
      await wait(1100);
      const s = state(what);
      s.curve = (await moved).filter((p, i, all) => i === 0 || p[1] !== all[i - 1][1] || p[2] !== all[i - 1][2] || i === all.length - 1);
      out.steps.push(s);
    }
    return out;
  },

  async speed() {
    start(five(), {scrollingSpeed: 1200, easingcss3: 'cubic-bezier(0.1, 0.7, 1.0, 0.1)'});
    await wait(300);
    const steps = [];
    fullpage_api.moveSectionDown();
    steps.push(state('moveSectionDown, at once'));
    await wait(1500);
    steps.push(state('moveSectionDown'));
    fullpage_api.setScrollingSpeed(300);
    fullpage_api.moveSectionDown();
    steps.push(state('speed 300, moveSectionDown, at once'));
    await wait(1000);
    steps.push(state('speed 300, moveSectionDown'));
    return {steps};
  },

  async responsive() {
    const cases = [];
    for (const o of [{responsiveWidth: 1200}, {responsiveHeight: 800}, {responsiveWidth: 900, responsiveHeight: 600}, {responsiveWidth: 1001}, {responsiveWidth: 1000}]) {
      start(five(), o);
      await wait(300);
      const s = state('started');
      key('ArrowDown');
      await wait(1200);
      const k = state('ArrowDown');
      cases.push({options: o, autoScrolling: options().autoScrolling, fitToSection: options().fitToSection,
                  width: window.innerWidth, height: window.innerHeight, started: s, keyed: k});
      fullpage_api.destroy('all');
      window.scrollTo(0, 0);
      await wait(300);
    }
    start(five(), {});
    await wait(300);
    fullpage_api.setResponsive(true);
    await wait(100);
    const on = state('setResponsive true');
    on.autoScrolling = options().autoScrolling;
    fullpage_api.setResponsive(false);
    await wait(100);
    const off = state('setResponsive false');
    off.autoScrolling = options().autoScrolling;
    return {cases, set: [on, off]};
  },

  async lazy() {
    const cases = [];
    for (const threshold of [0, 1]) {
      start([{img: true}, {img: true, slides: 3, slide_imgs: true}, {img: true}, {img: true}, {img: true}], {lazyLoadThreshold: threshold});
      await wait(300);
      const loaded = () => Array.from(document.querySelectorAll('img')).filter(i => i.getAttribute('src')).map(i => i.id);
      const steps = [];
      const go = async (what, f) => { f(); await wait(1200); const s = state(what); s.loaded = loaded(); steps.push(s); };
      await go('start', () => {});
      await go('moveTo 2', () => fullpage_api.moveTo(2));
      await go('moveSlideRight', () => fullpage_api.moveSlideRight());
      await go('moveTo 4', () => fullpage_api.moveTo(4));
      cases.push({threshold, steps, loaded_classes: Array.from(document.querySelectorAll('.fp-loaded')).map(e => e.dataset.i || 'slide')});
      fullpage_api.destroy('all');
      await wait(300);
    }
    return {cases};
  },

  async hidden() {
    start([{}, {style: 'display: none'}, {}, {}, {}], {navigation: true});
    await wait(300);
    const steps = [state('start')];
    steps[0].dots = document.querySelectorAll('#fp-nav li').length;
    for (const k of ['ArrowDown', 'ArrowDown', 'ArrowUp', 'ArrowUp']) { key(k); await wait(1200); steps.push(state(k)); }
    return {steps};
  },

  // a section taller than the page scrolls inside before the page moves on
  async overflow() {
    start([{}, {tall: 1500}, {}, {cls: 'fp-noscroll', tall: 1500}, {}], {});
    await wait(300);
    const inner = () => document.querySelector('.section.active .fp-overflow');
    const out = {steps: [state('start')]};
    const go = async (what, f) => {
      f();
      await wait(1200);
      const s = state(what);
      const i = inner();
      s.inner = i ? {scroll: i.scrollTop, height: i.scrollHeight, client: i.clientHeight, class: i.className} : null;
      out.steps.push(s);
    };
    await go('ArrowDown into the tall one', () => key('ArrowDown'));
    await go('wheel at its top', () => wheel(100, inner()));
    await go('ArrowDown at its top', () => key('ArrowDown'));
    await go('inner scrolled to 400, wheel', () => { inner().scrollTop = 400; inner().dispatchEvent(new Event('scroll')); wheel(100, inner()); });
    await go('inner scrolled to its end, wheel', () => { const i = inner(); i.scrollTop = i.scrollHeight; i.dispatchEvent(new Event('scroll')); setTimeout(() => wheel(100, inner()), 50); });
    await go('ArrowUp, back into the tall one', () => key('ArrowUp'));
    await go('wheel up', () => { const i = inner(); wheel(-100, i); });
    await go('inner scrolled to its top, wheel up', () => { const i = inner(); i.scrollTop = 0; i.dispatchEvent(new Event('scroll')); setTimeout(() => wheel(-100, inner()), 50); });
    await go('moveTo 4, the one with fp-noscroll', () => fullpage_api.moveTo(4));
    await go('ArrowDown there', () => key('ArrowDown'));
    return out;
  },

  async heights() {
    start([{}, {}, {}, {cls: 'fp-auto-height', style: 'height: 200px'}], {paddingTop: '50px', paddingBottom: '10px'});
    await wait(300);
    const steps = [state('start')];
    const sections = Array.from(document.querySelectorAll('.fp-section')).map(s => ({rect: rect(s), padding: [getComputedStyle(s).paddingTop, getComputedStyle(s).paddingBottom], class: s.className}));
    for (const k of ['End', 'ArrowUp', 'ArrowDown']) { key(k); await wait(1200); steps.push(state(k)); }
    return {sections, steps};
  },

  // beforeLeave refuses twice; onLeave refuses once
  async refused() {
    let before = 0;
    let leave = 0;
    answers.beforeLeave = () => { before++; return before > 2; };
    answers.onLeave = () => { leave++; return leave !== 1; };
    start(five(), {});
    await wait(300);
    const steps = [state('start')];
    for (let k = 0; k < 5; k++) { key('ArrowDown'); await wait(1200); steps.push(state('ArrowDown ' + (k + 1))); }
    return {steps};
  },
};

(async () => {
  let out;
  try {
    out = await runs[run]();
    out.run = run;
    out.window = [window.innerWidth, window.innerHeight];
    out.version = fullpage_api.version;
  } catch (e) {
    out = {run, error: String(e && e.stack || e)};
  }
  document.getElementById('out').textContent = JSON.stringify(out);
})();
</script></body></html>
