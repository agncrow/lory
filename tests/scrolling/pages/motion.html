<!doctype html>
<!-- Motion's scroll() on a fixed page, for tests/scrolling/reference.py: a
     scroll container 400 by 600 px over 3000 px of content, targets at
     fixed places in it, each followed with several offsets; the container
     scrolled to fixed positions and each handler's progress and resolved
     offsets read after Motion has measured (two animation frames). The
     window's own scroll, with no target, is read the same way. -->
<html><head><meta charset="utf-8">
<style>
body { margin: 0; height: 2600px; }
#scroller { position: relative; overflow: auto; width: 400px; height: 600px; }
#content { position: relative; height: 3000px; }
#content > div { position: absolute; left: 0; width: 300px; }
#out { position: fixed; top: 0; right: 0; width: 10px; height: 10px; overflow: hidden; margin: 0; }
</style></head><body>
<div id="scroller"><div id="content">
  <div id="small" style="top: 900px; height: 200px"></div>
  <div id="tall" style="top: 1500px; height: 900px"></div>
  <div id="late" style="top: 2700px; height: 150px"></div>
</div></div>
<pre id="out">pending</pre>
<script>
// (headless Chrome under a virtual time budget draws no frames, so its
// animation frames stop: they are given by timers instead, before Motion
// is loaded, which Motion's frame loop then runs on)
window.requestAnimationFrame = (f) => setTimeout(() => f(performance.now()), 16);
window.cancelAnimationFrame = (id) => clearTimeout(id);
</script>
<script src="lib/motion/dist/motion.js"></script>
<script>
const offsets = [
  ['start end', 'end start'],
  ['start start', 'end end'],
  ['start end', 'end end'],
  ['center center', 'end start'],
  ['end end', 'start start'],
  ['start end', 'center center', 'end start'],
  [0, 1],
  ['0 1', '1 0'],
  ['100px end', 'end -50px'],
  ['25% 75%', '75% 25%'],
  ['start 50vh', 'end 10vh'],
  ['end', 'start'],
  ['center', '150px'],
  ['start 0.25', 'end 0.75'],
  ['-20% 120%', '0.5 -0.1'],
];
const targets = ['small', 'tall', 'late'];
const scroller = document.getElementById('scroller');
const latest = {};
const handlers = [];
for (const name of targets) {
  offsets.forEach((offset, i) => {
    const key = name + ':' + i;
    handlers.push({key, target: name, offset});
    Motion.scroll((progress, info) => {
      latest[key] = {progress, offsets: info.y.offset.slice(), current: info.y.current,
                     target_length: info.y.targetLength, target_offset: info.y.targetOffset,
                     container_length: info.y.containerLength, scroll_length: info.y.scrollLength};
    }, {container: scroller, target: document.getElementById(name), offset});
  });
}
// the container itself, no target: progress through all it scrolls
Motion.scroll((progress, info) => {
  latest['container'] = {progress, offsets: info.y.offset.slice(), current: info.y.current,
                         container_length: info.y.containerLength, scroll_length: info.y.scrollLength};
}, {container: scroller});
// the window's scroll
Motion.scroll((progress, info) => {
  latest['window'] = {progress, offsets: info.y.offset.slice(), current: info.y.current,
                      container_length: info.y.containerLength, scroll_length: info.y.scrollLength};
});
const frames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const positions = [0, 37, 300, 301, 450, 600, 750, 899, 900, 1000, 1150, 1200, 1500, 1650, 1800, 2000, 2100, 2250, 2399, 2400];
const page_positions = [0, 250, 1000, 1887];
(async () => {
  await frames();
  const out = {window_height: window.innerHeight, client_height: document.documentElement.clientHeight,
               handlers: handlers.map(h => ({key: h.key, target: h.target, offset: h.offset})), samples: [], page: []};
  for (const y of positions) {
    scroller.scrollTop = y;
    // (and no frames, no scroll events: the event is sent as the page
    // would send it)
    scroller.dispatchEvent(new Event('scroll'));
    await frames();
    const seen = {};
    for (const k in latest) seen[k] = latest[k].progress;
    out.samples.push({scroll: scroller.scrollTop, progress: seen});
  }
  // (what each handler resolved its offsets to, and the lengths it measured,
  // which stay the same while the page does)
  for (const h of out.handlers) {
    const l = latest[h.key];
    Object.assign(h, {resolved: l.offsets, target_length: l.target_length, target_offset: l.target_offset,
                      container_length: l.container_length, scroll_length: l.scroll_length});
  }
  out.handlers.push(Object.assign({key: 'container', target: null, offset: null, resolved: latest['container'].offsets},
                                  {container_length: latest['container'].container_length, scroll_length: latest['container'].scroll_length}));
  scroller.scrollTop = 0;
  for (const y of page_positions) {
    window.scrollTo(0, y);
    window.dispatchEvent(new Event('scroll'));
    await frames();
    const w = latest['window'];
    out.page.push({scroll: window.scrollY, progress: w.progress, resolved: w.offsets, container_length: w.container_length,
                   scroll_length: w.scroll_length});
  }
  document.getElementById('out').textContent = JSON.stringify(out);
})();
</script></body></html>
